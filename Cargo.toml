[workspace]
resolver = "2"
members = ["crates/telemetry-core","crates/cache-core","crates/aim-ffi","crates/csv-parser","crates/telemetry-store","crates/telemetry-ipc", "crates/overlay","crates/xrk-meta","src-tauri","crates/migrate-v1", "tests/golden-tests"]
[workspace.dependencies]
serde = { version="1", features=["derive"] }
thiserror = "2"
specta = { version="2.0.0-rc.20", features=["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
serde_json = "1"
libloading = "0.8"
memmap2 = "0.9"
rayon = "1.10"
fast-float = "0.2"
rustfft = "6"
dashmap = "6"
ab_glyph = "0.2"
png = "0.17"
tiny-skia = { version = "0.11", features = ["png-format"] }
tauri = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
rfd = "0.15"
sha2 = "0.10"
reqwest = "0.12"
flate2 = "1"
dirs = "6"
tauri-build = "2"
tauri-plugin-window-state = "2"
