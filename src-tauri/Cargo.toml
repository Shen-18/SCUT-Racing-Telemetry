[package]
name="scut-racing-telemetry"
version="1.0.1"
edition="2021"
[build-dependencies]
tauri-build.workspace=true
[dependencies]
tauri.workspace=true
telemetry-core={path="../crates/telemetry-core"}
cache-core={path="../crates/cache-core"}
aim-ffi={path="../crates/aim-ffi"}
csv-parser={path="../crates/csv-parser"}
telemetry-store={path="../crates/telemetry-store"}
telemetry-ipc={path="../crates/telemetry-ipc"}
overlay={path="../crates/overlay"}

dashmap.workspace=true
serde.workspace=true
serde_json.workspace=true
zip.workspace=true
rfd.workspace=true
reqwest.workspace=true
dirs.workspace=true
tauri-plugin-window-state.workspace=true
tauri-plugin-updater.workspace=true

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
